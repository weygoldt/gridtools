[project]
name = "gridtools"
version = "2.0.0.dev0"
description = "Read and simulate multi-electrode grid recordings of wave-type weakly electric fish."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Patrick Weygoldt", email = "patrick@weygoldt.com" }]
keywords = ["electric fish", "electrode grid", "simulation", "neuroethology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
]

[project.urls]
Repository = "https://github.com/weygoldt/gridtools"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: long-running tests",
    "data: tests that need the recordings on /mnt/data2 (skipped if absent)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PT"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
