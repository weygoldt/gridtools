site_name: gridtools
site_description: Read and simulate multi-electrode grid recordings of wave-type weakly electric fish.
repo_url: https://github.com/weygoldt/gridtools
repo_name: weygoldt/gridtools
edit_uri: edit/main/docs/

# Build: uvx --from mkdocs==1.6.1 --with mkdocs-material==9.8.1 mkdocs build --strict
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Simulation:
      - Simulating scenes: simulation.md
      - Scene outputs: outputs.md
      - Ground truth: ground-truth.md
  - Libraries:
      - Template library: templates.md
      - Background library: background.md
  - Real data:
      - Reading recordings: io.md
      - Calibration: calibration.md
  - Development: development.md
